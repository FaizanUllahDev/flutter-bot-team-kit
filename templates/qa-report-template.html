<style>
:root{--navy:#00377d;--bg:#f4f7fc;--light:#e8f3fe;--line:#d5deec;--muted:#557aa9;--yellow:#ffd100;--green:#1e9e57;--red:#d6343a;--amber:#e39b00;--text:#1b2a44}
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.panel{position:sticky;top:0;z-index:9;background:#fff;border-bottom:2px solid var(--navy);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.panel b{color:var(--navy)} .panel label{white-space:nowrap}
.panel button{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}
.panel .hint{width:100%;color:var(--muted);font-size:10px}
.cover{background:var(--navy);color:#fff;min-height:210mm;padding:22mm 18mm 14mm;display:flex;flex-direction:column;break-after:page}
.logo{font-size:52px;font-weight:900;font-style:italic;color:var(--yellow);letter-spacing:-1px}
.logo small{display:inline-block;font-size:14px;font-style:normal;color:var(--yellow);margin-left:6px}
.eyebrow{color:var(--yellow);font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin-top:auto}
.cover h1{font-size:45px;font-style:italic;font-weight:700;margin:8px 0 0;line-height:1.1}
.cover h1 span{display:block;color:var(--yellow)}
.cover p.intro{font-size:15.5px;max-width:170mm;line-height:1.5;opacity:.95}
.cover .meta{margin-top:auto;font-size:11px;color:#9fb6d6}
.cover .devs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cover .devs div{border:1px solid #3a63a0;border-radius:8px;padding:7px 12px;font-size:12px}
.cover .devs div b{color:var(--yellow)}
main{padding:12mm 14mm 4mm}
section{margin-bottom:9mm}
.sec-eyebrow{break-after:avoid;color:var(--muted);font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:.5px}
h2{color:var(--navy);font-style:italic;font-size:24px;margin:3px 0 6px;display:flex;align-items:center;gap:10px;break-after:avoid}
h2 .pill{margin-left:auto;font-style:normal}
h3{color:var(--navy);font-size:15px;font-style:italic;margin:0 0 6px}
p.lead{font-size:12px;margin:0 0 10px;line-height:1.5}
.kpis{display:flex;gap:10px;margin:10px 0 12px;break-inside:avoid}
.kpi{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:62px}
.kpi .v{font-size:20px;font-weight:700;color:var(--navy)}
.kpi .l{font-size:9.5px;margin-top:4px;color:var(--text)}
.kpi.hl{background:var(--navy);border-color:var(--navy)} .kpi.hl .v{color:var(--yellow)} .kpi.hl .l{color:#fff}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:8px;overflow:hidden;font-size:10px;break-inside:auto}
thead th{background:var(--navy);color:#fff;text-align:left;padding:7px 10px;font-weight:700}
td{padding:6px 10px;border-top:1px solid #eef2f8}
tbody tr:nth-child(even) td{background:var(--light)}
tr{break-inside:avoid}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}.warn{color:var(--amber);font-weight:700}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:9px;font-weight:700;color:#fff;text-transform:uppercase}
.p-pass,.p-aligned{background:var(--green)}.p-fail,.p-major{background:var(--red)}.p-minor,.p-warn,.p-medium,.p-wrong,.p-truncated,.p-overflow{background:var(--amber)}.p-high,.p-missing{background:var(--red)}.p-low{background:var(--muted)}
.okline{background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:9px 12px;color:var(--green);font-weight:700;margin-top:8px}
h3.sub{margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;break-inside:avoid;margin-bottom:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:12px;break-inside:avoid;margin-bottom:12px}
.shot{background:var(--light);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center}
.shot img{max-width:100%;max-height:118mm;border-radius:6px}
.slot{width:62%;aspect-ratio:390/844;max-height:110mm;border:2px dashed #9fb6d6;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;text-align:center;background:#f7faff}
.cap{font-size:9px;color:var(--muted);margin-top:6px;align-self:flex-start}
.side{background:var(--light);border-radius:10px;padding:10px}
.side .kpis{margin:0 0 8px}.side .kpi{padding:8px}.side .kpi .v{font-size:17px}
.side h4{color:var(--muted);font-size:9px;text-transform:uppercase;margin:8px 0 4px}
.side ul{margin:0;padding-left:14px;line-height:1.6}
.ef{display:grid;grid-template-columns:1.3fr .6fr .6fr;gap:12px;break-inside:avoid;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.ef .slot{width:100%;max-height:52mm;aspect-ratio:auto;height:52mm}
.ef dl{margin:6px 0 0;display:grid;grid-template-columns:70px 1fr;gap:4px 8px;font-size:10px}
.ef dt{color:var(--muted);font-weight:700}
.ef .shot{padding:6px}
.note{font-size:10px;font-style:italic;color:var(--muted);margin-top:8px}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;padding:4mm 14mm 6mm;border-top:1px solid var(--line);margin:0 14mm}
.hidden{display:none!important}
table.mini{font-size:8.5px;border-radius:6px}table.mini th{padding:4px 6px;font-size:8.5px}table.mini td{padding:3px 6px}table.mini .pill{font-size:7.5px;padding:2px 6px}

.p-pass,.p-low{}
.okline2{background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:9px 12px;color:var(--green);font-weight:700;margin-top:8px}
.pf{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;break-inside:avoid}
.spec dl{margin:6px 0 0;display:grid;grid-template-columns:90px 1fr;gap:5px 8px;font-size:10.5px}.spec dt{color:var(--muted);font-weight:700}
.score{font-size:30px;font-weight:700;color:var(--yellow)}
video{max-width:100%;max-height:120mm;border-radius:8px}
@media print{.panel{display:none} body{background:var(--bg)} main{padding-top:10mm}
 .foot{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--bg);padding:3mm 14mm 4mm}
 main{padding-bottom:14mm}
 .foot .pg::after{content:""} }
.sc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.scc{background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:12px 14px;break-inside:avoid}
.scc .t{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.scc .n{font-size:30px;font-weight:700;color:var(--navy);margin-top:4px}.scc .n small{font-size:12px;color:var(--muted)}
.scc .g{float:right;width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
.scc .nt{font-size:10px;margin:6px 0 8px;min-height:26px}
.scc ul{list-style:none;margin:0;padding:0;font-size:9px;border-top:1px dashed var(--line)}.scc li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #eef2f8}.scc li b{color:var(--text)}
.verdict{display:flex;align-items:center;gap:16px;background:var(--navy);color:#fff;border-radius:10px;padding:12px 18px;border-left:8px solid var(--yellow)}
.verdict .n{font-size:30px;font-weight:700;color:var(--yellow)}.verdict .g{font-size:22px;font-weight:700;background:var(--yellow);color:var(--navy);border-radius:8px;padding:2px 12px}
</style></head>
<body>
<div class="panel" id="panel">
  <b>Show / hide sections:</b><span id="toggles"></span>
  <button onclick="window.print()">Download as PDF</button>
  <div class="hint">Choices are saved in this browser. If headers still appear, untick "Headers and footers" in the print dialog (More settings). Turn on "Background graphics" if colors are missing.</div>
</div>
<div id="root"></div>
<script>
const C=JSON.parse(document.getElementById('qa-config').textContent);
const KEY='qa-report-sections';const saved=JSON.parse(localStorage.getItem(KEY)||'{}');
const S=Object.assign({},C.sections,saved);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill=s=>`<span class="pill p-${e(String(s).toLowerCase())}">${e(s)}</span>`;
const res=s=>{const u=String(s).toUpperCase();return `<span class="${u==='PASS'?'ok':u==='FAIL'?'bad':'warn'}">${e(s)}</span>`};
const tbl=(h,rows)=>`<table><thead><tr>${h.map(x=>`<th>${e(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const shot=(src,cap,label)=>`<div class="shot">${src?`<img src="${e(src)}">`:`<div class="slot">${e(label)}<br>screenshot slot</div>`}<div class="cap">${e(cap)}</div></div>`;
const kpis=k=>`<div class="kpis">${k.map(x=>`<div class="kpi ${x.hl?"hl":""}" ${x.sm?"style=\"flex:1.6\"":""}><div class="v">${e(x.value)}</div><div class="l">${e(x.label)}</div></div>`).join('')}</div>`;
const head=(eb,t,extra='')=>`<div class="sec-eyebrow">${e(eb)}</div><h2>${e(t)}${extra}</h2>`;
const grade=n=>n>=90?'A':n>=80?'B':n>=70?'C':n>=60?'D':n>=50?'E':'F';
const stat=n=>n>=80?'pass':n>=60?'warn':'fail';
const scol=n=>n>=80?'var(--green)':n>=60?'var(--amber)':'var(--red)';
const cardScore=c=>c.score!=null?c.score:Math.round((c.inputs||[]).reduce((a,i)=>a+(+i.sub||0),0)/Math.max(1,(c.inputs||[]).length));
const O=C.overview;const D=C.devices||[];
const B={
overview:()=>`<section>${head('Overview','Test setup')}
 ${kpis([{value:O.designFrame,label:'Design frame (base language), exact grade device',hl:true},{value:D.length,label:'devices tested'},{value:O.build,label:"build",sm:1},{value:O.taskKey,label:'Task'}])}
 ${tbl(['Device','ID','Size','Role'],D.map(d=>[`<b>${e(d.name)}</b>`,e(d.id),e(d.size),d.role==='Pixel check'?`<span class="ok">${e(d.role)}</span>`:e(d.role)]))}
 <div class="note">Design: ${e(O.designLink)} · Date: ${e(O.date)}</div></section>`,
scorecard:()=>{const SC=C.scorecard;if(!SC)return '';const W=SC.weights||{};const cs=SC.cards.map(c=>({...c,s:cardScore(c)}));
 const ov=SC.overall||{};const tot=ov.score!=null?ov.score:Math.round(cs.reduce((a,c)=>a+c.s*(W[c.key]??1/cs.length),0));const v=ov.verdict||stat(tot);
 return `<section style="break-inside:avoid">${head('Executive scorecard','Release health at a glance')}
 <div class="verdict"><div class="n">${tot}<small style="font-size:13px;color:#cfe0ff">/100</small></div><div class="g">${grade(tot)}</div><div><div style="font-weight:700">Overall verdict ${pill(v)}</div><div style="font-size:10.5px;color:#cfe0ff;margin-top:3px">${e(ov.text)}</div></div></div>
 <div class="sc">${cs.map(c=>`<div class="scc" style="--c:${scol(c.s)}"><div class="g">${grade(c.s)}</div><div class="t">${e(c.title)}</div><div class="n">${c.s}<small>/100</small></div>${pill(stat(c.s))}<div class="nt">${e(c.note)}</div><ul>${(c.inputs||[]).map(i=>`<li><span>${e(i.name)}</span><b>${e(i.value)}</b></li>`).join('')}</ul></div>`).join('')}</div>
 <div class="note">Score = average of input sub-scores (100 met, 70 near, 40 missed). Grade A 90+, B 80+, C 70+, D 60+, E 50+, F below 50. Overall = weighted average.</div></section>`},
summary:()=>`<section>${head('Result',C.summary.headline,' '+pill(C.summary.verdict))}<p class="lead">${e(C.summary.text)}</p>${kpis(C.summary.kpis)}</section>`,
pixel:()=>`<section>${head('Alignment by screen','Measured against the design')}<p class="lead">${e(C.pixel.rule)}</p>
 ${tbl(['Screen','Measured','Within 2 dp','Spacing OK','Minor','Major','Screen shift','Grade'],C.pixel.screens.map(s=>[e(s.name),s.measured,`<span class="ok">${e(s.within2)}</span>`,`<span class="ok">${e(s.spacing)}</span>`,s.minor,s.major?`<span class="bad">${s.major}</span>`:0,e(s.shift),pill(s.grade)]))}</section>
 ${C.pixel.screens.map(s=>`<section style="break-inside:avoid">${head(s.group,s.name,' '+pill(s.grade))}<div class="cmp">${shot(s.designImg,'Design (base language)','Design')}${shot(s.appImg,'App with measured elements','App')}
 <div class="side">${kpis([{value:s.within2,label:'within 2 dp'},{value:s.spacing,label:'spacing OK'},{value:s.shift,label:'screen shift'}])}
 <div>${s.measured} measured · ${s.major} major · ${s.minor} minor</div>${(()=>{const E=s.elements||[];if(!E.length&&s.measured==null)return '';const bad=E.filter(x=>x.grade==='minor'||x.grade==='major');const n=(s.measured??E.length)-bad.length;return `<h4>Element check</h4>${bad.length?`<table class="mini"><thead><tr><th>Element · property</th><th>Design</th><th>App</th><th>Diff</th><th></th></tr></thead><tbody>${bad.map(x=>`<tr><td><b>${e(x.element)}</b> · ${e(x.property)}</td><td>${e(x.expected)}</td><td>${e(x.actual)}</td><td class="${x.grade==='major'?'bad':'warn'}">${e(x.diff)}</td><td>${pill(x.grade)}</td></tr>`).join('')}</tbody></table>`:''}<div class="okline2" style="font-size:9.5px;padding:6px 10px;margin-top:6px">&#10003; All remaining UI elements aligned (${n})</div>`})()}</div></div></section>`).join('')}`,
translations:()=>{const T=C.translations,F=T.failed||[],keys=new Set(F.map(f=>f.key)),rest=(T.totalKeys||0)-keys.size;
 return `<section>${head('Localization','Translations vs design')}${kpis([{value:F.length,label:'failing key/language pairs',hl:true},{value:keys.size,label:'keys with issues'},{value:T.totalKeys,label:'keys checked'}])}
 ${F.length?tbl(['Key','Language','Expected (design)','Actual (app)','Issue'],F.map(f=>[`<b>${e(f.key)}</b>`,`<b>${e(f.lang)}</b>`,e(f.expected),`<span class="bad">${e(f.actual)}</span>`,pill(f.issue)])):''}
 <div class="okline2">&#10003; All ${F.length?'remaining ':''}${rest} keys PASS in all languages</div></section>`},
devices:()=>`<section>${head('Safety checks','Device matrix')}${tbl(['Check',...D.map(d=>d.name)],C.deviceMatrix.rows.map(r=>[e(r.check),...D.map(d=>r.results&&r.results[d.name]!=null?res(r.results[d.name]):'<span class="warn">N/A</span>')]))}</section>`,
testcases:()=>`<section>${head('Functional','Test cases')}${tbl(['ID','Title','Steps','Expected','Result'],C.testcases.rows.map(r=>[`<b>${e(r.id)}</b>`,e(r.title),e(r.steps),e(r.expected),res(r.result)]))}</section>`,
errorflows:()=>{const it=C.errorflows.items;const p=it.filter(i=>i.status==='PASS').length;
 return `<section>${head('Error flows','Error and edge scenarios')}<p class="lead">${e(C.errorflows.note)}</p>
 ${kpis([{value:p+'/'+it.length,label:'error flows handled',hl:true},{value:it.length-p,label:'error flows failing'}])}
 ${tbl(['Scenario','Expected','Actual','Status'],it.map(i=>[`<b>${e(i.name)}</b>`,e(i.expected),e(i.actual),pill(i.status)]))}</section>
 <section>${it.map((i,n)=>`<div class="ef"><div><div class="sec-eyebrow">E${n+1} · Error flow</div><h3>${e(i.name)} ${pill(i.status)}</h3>
 <dl><dt>How</dt><dd>${e(i.how)}</dd><dt>Expected</dt><dd>${e(i.expected)}</dd><dt>Actual</dt><dd class="${i.status==='PASS'?'':'bad'}">${e(i.actual)}</dd></dl></div>
 ${shot(i.designImg,'Design error state','Design')}${shot(i.appImg,'App error state','App')}</div>`).join('')}</section>`},
failures:()=>`<section>${head('Defects','Failures')}${tbl(['ID','Severity','Screen','Issue','Device'],C.failures.rows.map(r=>[`<b>${e(r.id)}</b>`,pill(r.severity),e(r.screen),e(r.issue),e(r.device)]))}</section>`,
uiperf:()=>{const U=C.uiPerf;if(!U)return '';const R=U.rows||[];const T=U.thresholds||{};const scr=new Set(R.map(r=>r.screen));const rest=(U.totalScreens||0)-scr.size;const hasImg=R.some(r=>r.imageCacheHit);
 return `<section>${head('UI performance','UI performance by screen')}<p class="lead">Targets: FPS ${'>='} ${e(T.fps)}, janky frames ${'<='} ${e(T.jankyPct)}%, first render ${'<='} ${e(T.firstRenderMs)} ms, rebuilds within budget. Only failing or warning screen x device rows are listed.</p>
 ${kpis([{value:R.length,label:'failing screen x device rows',hl:true},{value:scr.size,label:'screens with issues'},{value:U.totalScreens,label:'screens measured'},{value:D.length,label:'devices'}])}
 ${R.length?tbl(['Screen','Device','Avg FPS','Janky frames','First render / load','Rebuilds',...(hasImg?['Image cache hit']:[]),'Status'],R.map(r=>[`<b>${e(r.screen)}</b>`,e(r.device),`<span class="${r.fps<T.fps?'bad':''}">${e(r.fps)}</span>`,e(r.jankyPct),`<span class="${r.firstRenderMs>T.firstRenderMs?'bad':''}">${e(r.firstRenderMs)} ms</span>`,e(r.rebuilds),...(hasImg?[e(r.imageCacheHit||'-')]:[]),pill(r.status)])):''}
 <div class="okline2">&#10003; All ${R.length?'remaining ':''}${rest} screens PASS on all devices</div></section>`},
performance:()=>{const P=C.performance,d=P.device||{},PD=P.perDevice||[];const avg=P.overallScore!=null?P.overallScore:(PD.length?Math.round(PD.reduce((a,x)=>a+(+x.score||0),0)/PD.length):parseInt(P.score));
 return `<section style="break-inside:avoid">${head('Performance · all devices','App quality across all devices',' '+pill(P.verdict))}<p class="lead">${e(P.verdictText)}</p>
 <div class="pf"><div class="card spec"><div class="sec-eyebrow">Lowest-spec device</div><h3>${e(d.name)}</h3><dl><dt>Model</dt><dd>${e(d.model)}</dd><dt>RAM</dt><dd>${e(d.ram)}</dd><dt>Storage</dt><dd>${e(d.storage)}</dd><dt>Android</dt><dd>${e(d.android)}</dd><dt>CPU</dt><dd>${e(d.cpu)}</dd></dl></div>
 <div class="kpi hl" style="display:flex;flex-direction:column;justify-content:center;border-radius:10px"><div class="score">${avg}/100 <span style="font-size:18px">${grade(avg)}</span></div><div class="l">overall app quality score across ${PD.length||1} devices · lowest ${e(d.name)} ${e(P.score)} · verdict ${pill(P.verdict)}</div></div></div>
 ${PD.length?`<h3 class="sub">Quality score per device</h3>${tbl(['Device','Score','Grade','Cold start','Peak memory','CPU peak','Avg FPS','Crash / ANR','Verdict'],PD.map(x=>[`<b>${e(x.device)}</b>`,`<b>${e(x.score)}</b>/100`,`<b style="color:${scol(x.score)}">${grade(x.score)}</b>`,e(x.coldStart),e(x.peakMem),e(x.cpuPeak),e(x.fps),e(x.crashes),pill(x.verdict)]))}`:''}
 <h3 class="sub">Detail on ${e(d.name)}</h3>${tbl(['Metric','Value','Target','Status'],(P.metrics||[]).map(m=>[`<b>${e(m.name)}</b>`,e(m.value),e(m.target),pill(m.status)]))}</section>`},
api:()=>{const F=C.api.failed||[];const rec=F.filter(f=>f.recovered).length;
 return `<section>${head('Network','API latency')}${tbl(['Endpoint','p50','p95','Status'],C.api.rows.map(r=>[e(r.endpoint),e(r.p50),e(r.p95),res(r.status)]))}
 <div style="break-inside:avoid"><h3 class="sub">Failed requests during success flow</h3>
 ${kpis([{value:F.length,label:'failed requests in success flow',hl:true},{value:rec,label:'recovered (retry or fallback)'},{value:F.length-rec,label:'not recovered'}])}
 ${F.length?tbl(['Endpoint','Method','Status','Error','Latency','Device','Recovered','Impact'],F.map(f=>[e(f.endpoint),e(f.method),`<span class="bad">${e(f.status)}</span>`,e(f.error),e(f.latency),e(f.device),f.recovered?'<span class="ok">Yes</span>':'<span class="bad">No</span>',pill(f.impact)])):'<div class="okline">&#10003; No failed requests during the success flow</div>'}</div></section>`},
video:()=>`<section style="break-inside:avoid">${head('Recording','Success flow video')}<div class="card">${C.video.src?`<video controls src="${e(C.video.src)}"></video>`:`<div class="slot" style="width:120px">video slot</div>`}<div class="cap">${e(C.video.caption)} (video plays in HTML only; PDF shows this card)</div></div></section>`,
signoff:()=>`<section style="break-inside:avoid">${head('Sign-off','Decision')}${kpis([{value:C.signoff.decision,label:'decision',hl:true},{value:C.signoff.qa,label:'QA'},{value:C.signoff.date,label:'date'}])}</section>`
};
const NAMES={overview:'Overview',scorecard:'Scorecard',uiperf:'UI performance',summary:'Summary',pixel:'Pixel grade',translations:'Translations',devices:'Device matrix',testcases:'Test cases',errorflows:'Error flows',failures:'Failures',performance:'Performance',api:'API latency',video:'Video',signoff:'Sign-off'};
function render(){
 document.getElementById('root').innerHTML=`<div class="cover"><div class="logo">APP<small>logo</small></div>
 <div class="eyebrow">${e(C.eyebrow)}</div><h1>${e(C.title)}<span>${e(C.titleAccent)}</span></h1><p class="intro">${e(C.intro)}</p>
 <div class="devs"><div>Design <b>${e(O.designFrame)}</b></div>${D.map(d=>`<div>${e(d.name)} <b>${e(d.size)}</b></div>`).join('')}</div>
 <div class="meta">${e(C.version)}</div></div>
 <main>${Object.keys(B).filter(k=>S[k]).map(k=>B[k]()).join('')}</main>
 <div class="foot"><span>QA Report · ${e(C.app)}</span><span>${e(O.taskKey)}</span></div>`;}
document.getElementById('toggles').innerHTML=Object.keys(B).map(k=>`<label><input type="checkbox" data-k="${k}" ${S[k]?'checked':''}> ${NAMES[k]}</label>`).join(' ');
document.querySelectorAll('#toggles input').forEach(i=>i.onchange=()=>{S[i.dataset.k]=i.checked;localStorage.setItem(KEY,JSON.stringify(S));render();});
render();
</script>
</body></html>
